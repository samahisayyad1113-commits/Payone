services:
 postgres:
  image: postgres:16
  environment:
   POSTGRES_DB: payone
   POSTGRES_USER: payone
   POSTGRES_PASSWORD: payone_dev_only
  ports: ["5432:5432"]
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U payone -d payone"]
   interval: 5s
   timeout: 5s
   retries: 10
 redis:
  image: redis:7
  ports: ["6379:6379"]
 backend:
  build: ./backend
  ports: ["8080:8080"]
  environment:
   PAYONE_DB_URL: jdbc:postgresql://postgres:5432/payone
   PAYONE_DB_USER: payone
   PAYONE_DB_PASSWORD: payone_dev_only
   PAYONE_REDIS_HOST: redis
   RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
   RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
   RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  depends_on:
   postgres:
    condition: service_healthy
